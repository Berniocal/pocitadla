name: Run prevody more quantities patch

on:
  push:
    paths:
      - '.github/workflows/run-prevody-more-quantities.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_prevody_more_quantities.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Add more conversion quantities and coverage option"
          git push
