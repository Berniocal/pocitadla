name: Apply exponential range fix

on:
  push:
    paths:
      - '.github/workflows/apply-exp-range-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prevody.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('function randomExponentialNumber(range){')
          end = text.index('\n\nfunction randomValueInRange', start)
          new_func = (
              "function randomExponentialNumber(range){\n"
              "  const minExp = settings.mode === 'ss' ? -10 : Math.floor(Math.log10(range.min));\n"
              "  const maxExp = settings.mode === 'ss' ? 10 : Math.floor(Math.log10(range.max));\n"
              "  const exponents = [];\n"
              "  for(let e = minExp; e <= maxExp; e++) if(e !== 0) exponents.push(e);\n"
              "\n"
              "  for(let attempt=0; attempt<400; attempt++){\n"
              "    const exponent = randomChoice(exponents);\n"
              "    const mantissaRaw = randomFloat(1, 9.99);\n"
              "    const mantissa = Number(trimCz(formatCz(mantissaRaw, 0, 2)).replace(',', '.'));\n"
              "    const value = mantissa * Math.pow(10, exponent);\n"
              "    if(Number.isFinite(value) && value > 0){\n"
              "      const visible = `${trimCz(formatCz(mantissa, 0, 2))}·10${toSuperscript(exponent)}`;\n"
              "      return {visible, value, exponential:true};\n"
              "    }\n"
              "  }\n"
              "  return randomPlainNumber(range);\n"
              "}"
          )
          text = text[:start] + new_func + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-energy-kcal-exp-zero.yml
          rm -f .github/workflows/extend-exp-range.yml
          rm -f .github/workflows/apply-exp-range-fix.yml
          git add prevody.html .github/workflows/
          git commit -m "Allow exponents up to plus or minus ten"
          git push
