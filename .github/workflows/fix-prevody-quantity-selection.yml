name: Fix převody quantity selection

on:
  push:
    paths:
      - '.github/workflows/fix-prevody-quantity-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prevody.html')
          text = path.read_text(encoding='utf-8')

          old1 = "const quantities = preferredQuantity ? [preferredQuantity, ...selectedQuantities().filter(q => q.id !== preferredQuantity.id)] : selectedQuantities();"
          new1 = """const lockPreferred = Boolean(preferredQuantity && ensureAllQuantitiesForMode());
            const quantities = lockPreferred
              ? [preferredQuantity]
              : preferredQuantity
                ? [preferredQuantity, ...selectedQuantities().filter(q => q.id !== preferredQuantity.id)]
                : selectedQuantities();"""

          old2 = "const q = guard < quantities.length ? quantities[guard] : randomChoice(quantities);"
          new2 = "const q = lockPreferred ? preferredQuantity : (guard < quantities.length ? quantities[guard] : randomChoice(quantities));"

          if old1 not in text:
              raise SystemExit('Expected makeExample quantities line not found')
          if old2 not in text:
              raise SystemExit('Expected makeExample quantity-choice line not found')

          text = text.replace(old1, new1, 1)
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix guaranteed selected quantities in prevody generator"
          git push
