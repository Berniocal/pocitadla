name: Run prevody step 12 speed compound

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step12-speed-compound.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step12_speed_compound.py
      - run: node tests/prevody.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html tests/prevody.test.mjs
          git diff --cached --quiet || git commit -m "Add km/min to SŠ speed conversions"
          git push
