name: Patch prevody results UI

on:
  push:
    paths:
      - '.github/workflows/patch-prevody-results.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update results display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prevody.html')
          text = path.read_text(encoding='utf-8')

          old = '.btn:hover,.iconBtn:hover{background:#fff8e8}\n'
          new = old + '.btn.resultsBtn{background:#dff4e8;border-color:#69b98d;color:#1f6b4a;box-shadow:0 2px 8px rgba(57,139,99,.14)}\n.btn.resultsBtn:hover{background:#cfeedd;border-color:#4fa978}\n'
          assert old in text, 'CSS anchor not found'
          text = text.replace(old, new, 1)

          old = '<button class="btn" id="toggleAnswersBtn">Zobrazit výsledky</button>'
          new = '<button class="btn resultsBtn" id="toggleAnswersBtn">Zobrazit výsledky</button>'
          assert old in text, 'toggle button not found'
          text = text.replace(old, new, 1)

          start = text.index("    const answer = settings.mode === 'ss'")
          end = text.index('    return `', start)
          replacement = (
              "    const resultText = settings.mode === 'ss' ? ex.resultExp : ex.resultPlain;\n"
              "    const taskResult = answersVisible\n"
              "      ? `${resultText} <span class=\"unit\">${ex.to}</span>`\n"
              "      : `<span class=\"unit\">${ex.to}</span>`;\n"
          )
          text = text[:start] + replacement + text[end:]

          old_task = '        <div class="task">${ex.value} <span class="unit">${ex.from}</span> = <span class="unit">${ex.to}</span></div>'
          new_task = '        <div class="task">${ex.value} <span class="unit">${ex.from}</span> = ${taskResult}</div>'
          assert old_task in text, 'task line not found'
          text = text.replace(old_task, new_task, 1)

          old_answer = '        <div class="answer ${answersVisible ? \'show\' : \'\'}">${ex.value} <span class="unit">${ex.from}</span> = ${answer}</div>\n'
          assert old_answer in text, 'answer line not found'
          text = text.replace(old_answer, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Show conversion results inline"
          git push
