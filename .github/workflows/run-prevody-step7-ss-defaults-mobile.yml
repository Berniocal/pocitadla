name: Run prevody step 7 SŠ defaults mobile

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step7-ss-defaults-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step7_ss_defaults_mobile.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Match SŠ defaults to ZŠ and fix mobile checkbox layout"
          git push
