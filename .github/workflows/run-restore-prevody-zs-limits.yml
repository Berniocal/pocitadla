name: Restore prevody ZS result limits

on:
  push:
    paths:
      - '.github/workflows/run-restore-prevody-zs-limits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/restore_prevody_zs_limits.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Restore ZŠ conversion result limits"
          git push
