name: Refine realistic quantity ranges

on:
  push:
    paths:
      - '.github/workflows/apply-physical-ranges-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine ranges
        run: python tools/patch_physical_ranges_v2.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('prevody.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', text)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/prevody.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/prevody.js
      - name: Commit changes and clean temporary patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git rm tools/patch_physical_ranges_v2.py .github/workflows/apply-physical-ranges-v2.yml
          git commit -m "Refine realistic ranges and keep exponential inputs bounded"
          git push
