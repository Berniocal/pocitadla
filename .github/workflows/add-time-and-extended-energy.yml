name: Add time and extended energy conversions

on:
  push:
    paths:
      - '.github/workflows/add-time-and-extended-energy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prevody.html')
          text = path.read_text(encoding='utf-8')

          old = """  quantitiesByMode:{
            zs:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','napeti'],
            ss:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','napeti']
          }"""
          new = """  quantitiesByMode:{
            zs:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','napeti','cas'],
            ss:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','napeti','cas']
          }"""
          if old not in text:
              raise SystemExit('Default quantity block not found')
          text = text.replace(old, new, 1)

          old = """  {id:'energie', title:'Energie', modes:['zs','ss'], build:buildEnergyUnits},
            {id:'napeti', title:'Napětí', modes:['zs','ss'], build:buildVoltageUnits},"""
          new = """  {id:'energie', title:'Energie', modes:['zs','ss'], build:buildEnergyUnits},
            {id:'energieplus', title:'Energie*', modes:['zs','ss'], build:buildExtendedEnergyUnits},
            {id:'napeti', title:'Napětí', modes:['zs','ss'], build:buildVoltageUnits},"""
          if old not in text:
              raise SystemExit('Energy metadata anchor not found')
          text = text.replace(old, new, 1)

          old = """function buildEnergyUnits(mode){
            const ids = mode === 'zs'
              ? ['f','p','n','µ','m','','k','M','G','T','P']
              : ['f','p','n','µ','m','','k','M','G','T','P'];
            return prefixedUnits('J', ids);
          }

          function buildVoltageUnits(mode){"""
          new = """function buildEnergyUnits(mode){
            const ids = mode === 'zs'
              ? ['f','p','n','µ','m','','k','M','G','T','P']
              : ['f','p','n','µ','m','','k','M','G','T','P'];
            return prefixedUnits('J', ids);
          }

          function buildExtendedEnergyUnits(mode){
            const units = [
              unit('J', 1, 0, null),
              unit('kJ', 1e3, 3, null),
              unit('MJ', 1e6, 6, null),
              unit('GJ', 1e9, 9, null),
              unit('Wh', 3600, Math.log10(3600), null),
              unit('kWh', 3.6e6, Math.log10(3.6e6), null),
              unit('MWh', 3.6e9, Math.log10(3.6e9), null),
              unit('cal', 4.184, Math.log10(4.184), null),
              unit('kcal', 4184, Math.log10(4184), null)
            ];
            if(mode === 'ss'){
              units.push(
                unit('eV', 1.602176634e-19, Math.log10(1.602176634e-19), null),
                unit('keV', 1.602176634e-16, Math.log10(1.602176634e-16), null),
                unit('MeV', 1.602176634e-13, Math.log10(1.602176634e-13), null),
                unit('GeV', 1.602176634e-10, Math.log10(1.602176634e-10), null)
              );
            }
            return units;
          }

          function buildVoltageUnits(mode){"""
          if old not in text:
              raise SystemExit('Energy builder anchor not found')
          text = text.replace(old, new, 1)

          old = """      <div id=\"quantityChecks\" class=\"checks\"></div>
            </div>"""
          new = """      <div id=\"quantityChecks\" class=\"checks\"></div>
              <p class=\"small\" style=\"margin-bottom:0\">* Energie* obsahuje i rozšířené jednotky jako Wh, kWh, MWh, cal a kcal; na SŠ také eV, keV, MeV a GeV.</p>
            </div>"""
          if old not in text:
              raise SystemExit('Quantity checks block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Add time to defaults and extended energy units"
          git push
