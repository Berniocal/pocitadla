name: One-time patch prevody prefix diversity

on:
  push:
    branches:
      - fix/prevody-prefix-diversity
    paths:
      - '.github/workflows/patch-prevody-prefix-diversity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prevody-prefix-diversity

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch prevody.html
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/patch_prevody.py
          python /tmp/patch_prevody.py

      - name: Run existing tests
        run: node tests/prevody.test.mjs

      - name: Run prefix diversity regression test
        env:
          TEST_PREP_B64: 
        run: |
          printf '%s' "$TEST_PREP_B64" | base64 -d > /tmp/prepare_diversity_test.py
          python /tmp/prepare_diversity_test.py
          node tests/prevody.diversity.tmp.mjs
          rm tests/prevody.diversity.tmp.mjs

      - name: Commit tested patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-prevody-prefix-diversity.yml
          git add prevody.html
          git commit -m "Improve prefix diversity in conversion generator"
          git push origin HEAD:fix/prevody-prefix-diversity
