name: Run prevody step 2 two sig digits

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step2-two-sig.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step2_two_sig_digits.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html tests/prevody.test.mjs
          git diff --cached --quiet || git commit -m "Limit assignment numbers to two significant digits"
          git push
