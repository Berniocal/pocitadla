name: Apply per quantity exp toggle

on:
  push:
    paths:
      - '.github/workflows/apply-per-quantity-exp-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody
        shell: bash
        run: |
          echo '   ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-per-quantity-exp-toggle.yml
          rm -f .github/workflows/apply-per-quantity-exp-toggle.yml
          git add prevody.html .github/workflows/
          git commit -m "Add per-quantity exponential toggle for SS conversions"
          git push
