name: Run prevody step 5 exp direction

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step5-exp-direction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step5_exp_direction.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html tests/prevody.test.mjs
          git diff --cached --quiet || git commit -m "Choose exponent sign by conversion direction"
          git push
