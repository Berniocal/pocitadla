name: Kosmicky detektor APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'kosmicky-detektor/android/**'
      - '.github/workflows/build-cosmic-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35 is present
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: kosmicky-detektor/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kosmicky-detektor-apk
          path: kosmicky-detektor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
