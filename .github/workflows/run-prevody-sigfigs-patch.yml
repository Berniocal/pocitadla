name: Run prevody significant figures patch

on:
  push:
    paths:
      - '.github/workflows/run-prevody-sigfigs-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_prevody_sigfigs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Use assignment significant figures in conversion results"
          git push
