name: Run prevody tests step 4 once

on:
  push:
    paths:
      - '.github/workflows/run-prevody-tests-step4-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/prevody.test.mjs
