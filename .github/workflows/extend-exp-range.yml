name: Extend exponential input range

on:
  push:
    paths:
      - '.github/workflows/extend-exp-range.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exponential input generation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prevody.html')
          text = path.read_text(encoding='utf-8')

          old = """function randomExponentialNumber(range){
  const minExp = Math.floor(Math.log10(range.min));
  const maxExp = Math.floor(Math.log10(range.max));
  for(let attempt=0; attempt<400; attempt++){
    let exponent = randomInt(minExp, maxExp);
    if(exponent === 0 && (minExp < 0 || maxExp > 0)){
      const nonZeroExponents = [];
      for(let e = minExp; e <= maxExp; e++) if(e !== 0) nonZeroExponents.push(e);
      if(nonZeroExponents.length) exponent = randomChoice(nonZeroExponents);
    }
    const lowMantissa = exponent === minExp ? range.min / Math.pow(10, exponent) : 1;
    const highMantissa = exponent === maxExp ? range.max / Math.pow(10, exponent) : 9.99;
    if(lowMantissa > highMantissa) continue;
    const mantissaRaw = randomFloat(Math.max(1, lowMantissa), Math.min(9.99, highMantissa));
    const mantissa = Number(trimCz(formatCz(mantissaRaw, 0, 2)).replace(',', '.'));
    const value = mantissa * Math.pow(10, exponent);
    if(value >= range.min && value <= range.max){
      const visible = `${trimCz(formatCz(mantissa, 0, 2))}·10${toSuperscript(exponent)}`;
      return {visible, value, exponential:true};
    }
  }
  return randomPlainNumber(range);
}"""

          new = """function randomExponentialNumber(range){
  // U exponenciálního zadání se neomezujeme běžným rozsahem čísel.
  // Pro SŠ dovolíme exponenty od -10 do 10, ale nikdy ne 0.
  const minExp = settings.mode === 'ss' ? -10 : Math.floor(Math.log10(range.min));
  const maxExp = settings.mode === 'ss' ? 10 : Math.floor(Math.log10(range.max));
  const exponents = [];
  for(let e = minExp; e <= maxExp; e++) if(e !== 0) exponents.push(e);

  for(let attempt=0; attempt<400; attempt++){
    const exponent = randomChoice(exponents);
    const mantissaRaw = randomFloat(1, 9.99);
    const mantissa = Number(trimCz(formatCz(mantissaRaw, 0, 2)).replace(',', '.'));
    const value = mantissa * Math.pow(10, exponent);
    if(Number.isFinite(value) && value > 0){
      const visible = `${trimCz(formatCz(mantissa, 0, 2))}·10${toSuperscript(exponent)}`;
      return {visible, value, exponential:true};
    }
  }
  return randomPlainNumber(range);
}"""

          if old not in text:
            raise SystemExit('Expected randomExponentialNumber function not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-energy-kcal-exp-zero.yml
          rm -f .github/workflows/extend-exp-range.yml
          git add prevody.html .github/workflows/
          git commit -m "Allow wider powers in exponential inputs"
          git push
