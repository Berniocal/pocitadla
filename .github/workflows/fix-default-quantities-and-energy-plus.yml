name: Fix default quantities and add Energy plus

on:
  push:
    paths:
      - '.github/workflows/fix-default-quantities-and-energy-plus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prevody.html')
          text = path.read_text(encoding='utf-8')

          # 1) Výchozích zůstává 10: napětí ven, čas dovnitř.
          text = text.replace(
              "zs:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','napeti']",
              "zs:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','cas']"
          )
          text = text.replace(
              "ss:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','napeti']",
              "ss:['delka','plocha','objem','hmotnost','sila','rychlost','hustota','tlak','energie','cas']"
          )

          # 2) Samostatná volitelná Energie* s rozšířenými jednotkami.
          energy_meta = "  {id:'energie', title:'Energie', modes:['zs','ss'], build:buildEnergyUnits},"
          energy_plus_meta = "  {id:'energieplus', title:'Energie*', modes:['zs','ss'], build:buildExtendedEnergyUnits},"
          if energy_plus_meta not in text:
              if energy_meta not in text:
                  raise SystemExit('Energy metadata anchor not found')
              text = text.replace(energy_meta, energy_meta + "\n" + energy_plus_meta, 1)

          if 'function buildExtendedEnergyUnits(mode)' not in text:
              marker = "function buildVoltageUnits(mode){"
              if marker not in text:
                  raise SystemExit('Voltage builder anchor not found')
              builder = """function buildExtendedEnergyUnits(mode){
            const units = [
              unit('J', 1, 0, null),
              unit('kJ', 1e3, 3, null),
              unit('MJ', 1e6, 6, null),
              unit('GJ', 1e9, 9, null),
              unit('Wh', 3600, Math.log10(3600), null),
              unit('kWh', 3.6e6, Math.log10(3.6e6), null),
              unit('MWh', 3.6e9, Math.log10(3.6e9), null),
              unit('cal', 4.184, Math.log10(4.184), null),
              unit('kcal', 4184, Math.log10(4184), null)
            ];
            if(mode === 'ss'){
              units.push(
                unit('eV', 1.602176634e-19, Math.log10(1.602176634e-19), null),
                unit('keV', 1.602176634e-16, Math.log10(1.602176634e-16), null),
                unit('MeV', 1.602176634e-13, Math.log10(1.602176634e-13), null),
                unit('GeV', 1.602176634e-10, Math.log10(1.602176634e-10), null)
              );
            }
            return units;
          }

          """
              text = text.replace(marker, builder + marker, 1)

          note = '<p class="small" style="margin-bottom:0">* Energie* obsahuje i Wh, kWh, MWh, cal a kcal; na SŠ také eV, keV, MeV a GeV.</p>'
          checks = '      <div id="quantityChecks" class="checks"></div>'
          if note not in text:
              if checks not in text:
                  raise SystemExit('Quantity checks anchor not found')
              text = text.replace(checks, checks + "\n      " + note, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Use time in defaults and add extended energy conversions"
          git push
