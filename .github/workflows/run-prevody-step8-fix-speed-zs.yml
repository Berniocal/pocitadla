name: Run prevody step 8 fix speed zs

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step8-fix-speed-zs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step8_fix_speed_zs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Keep ZŠ speed units simple while supporting SŠ compound mode"
          git push
