name: Run prevody core step 1

on:
  push:
    paths:
      - '.github/workflows/run-prevody-core-step1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_prevody_core_step1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Lock requested quantities during generation"
          git push
