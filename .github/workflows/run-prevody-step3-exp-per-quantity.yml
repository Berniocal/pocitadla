name: Run prevody step 3 exp per quantity

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step3-exp-per-quantity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step3_exp_per_quantity.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html tests/prevody.test.mjs
          git diff --cached --quiet || git commit -m "Add per-quantity exponential formatting"
          git push
