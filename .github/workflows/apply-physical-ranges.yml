name: Apply realistic quantity ranges

on:
  push:
    paths:
      - '.github/workflows/apply-physical-ranges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody
        run: python tools/patch_physical_ranges.py
      - name: Commit changes and clean temporary patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git rm tools/patch_physical_ranges.py .github/workflows/apply-physical-ranges.yml
          git commit -m "Add realistic default ranges for physical quantities"
          git push
