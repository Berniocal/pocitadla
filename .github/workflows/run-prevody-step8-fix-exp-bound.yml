name: Run prevody step 8 fix exp bound

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step8-fix-exp-bound.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step8_fix_exp_bound.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git diff --cached --quiet || git commit -m "Keep exponential input inside 10^-10 to 10^10"
          git push
