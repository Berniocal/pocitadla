name: Run prevody step 4 exp zero

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step4-exp-zero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step4_exp_zero.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html tests/prevody.test.mjs
          git diff --cached --quiet || git commit -m "Avoid redundant 10^0 in exponential format"
          git push
