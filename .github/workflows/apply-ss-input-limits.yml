name: Apply SS input limits

on:
  push:
    paths:
      - '.github/workflows/apply-ss-input-limits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prevody
        run: python _tmp_patch_ss_input_limits.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('prevody.html').read_text(encoding='utf-8')
          js = s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/prevody.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/prevody.js
      - name: Commit changes and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html
          git rm _tmp_patch_ss_input_limits.py .github/workflows/apply-ss-input-limits.yml
          git commit -m "Disable SS input limits by default and set exp defaults"
          git push
