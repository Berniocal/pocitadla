name: Run prevody step 14 exp3 regenerate

on:
  push:
    paths:
      - '.github/workflows/run-prevody-step14-exp3-regenerate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/prevody_step14_exp3_regenerate.py
      - run: node tests/prevody.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prevody.html tests/prevody.test.mjs
          git diff --cached --quiet || git commit -m "Require exp power 3 and add per-example regenerate"
          git push
